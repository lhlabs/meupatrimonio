name: One-shot card accounting integrity fix

on:
  push:
    branches: [fix/card-accounting-integrity]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply targeted financial integrity patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Trecho não encontrado em ${path}: ${from.slice(0, 80)}`);
            if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Trecho duplicado em ${path}; substituição abortada`);
            fs.writeFileSync(path, source.slice(0, first) + to + source.slice(first + from.length));
          }

          replaceOnce(
            'finance-logic.js',
            "  const statementMonth = new Date(year, month - 1 + (String(purchaseDate) > closingDate ? 1 : 0), 1, 12);",
            "  const statementMonth = new Date(year, month - 1 + (String(purchaseDate) >= closingDate ? 1 : 0), 1, 12);"
          );

          replaceOnce(
            'finance-logic.js',
            "      .filter(item => item?.status === 'active' && item.cardId === card.id)",
            "      .filter(item => item?.cardId === card.id && (item.status == null || item.status === 'active'))"
          );

          replaceOnce(
            'app.js',
            `  const recurring = $('#transactionRecurring');\n  if (recurring) {\n    if (cardMode) recurring.checked = false;\n    recurring.disabled = !!$('#transactionEditId')?.value || cardMode;\n  }`,
            `  const recurring = $('#transactionRecurring');\n  const recurringLabel = recurring?.closest('label');\n  if (recurring) {\n    const editing = !!$('#transactionEditId')?.value;\n    if (cardMode) recurring.checked = false;\n    recurring.disabled = editing || cardMode;\n    if (recurringLabel) recurringLabel.style.display = editing || cardMode ? 'none' : '';\n  }`
          );

          replaceOnce(
            'app.js',
            `          sourceType: 'recurring',\n          sourceId: recurring.id,\n          createdAt: serverTimestamp()`,
            `          sourceType: 'recurring',\n          sourceId: recurring.id,\n          walletId: recurring.walletId || null,\n          cardId: null,\n          createdAt: serverTimestamp()`
          );

          replaceOnce(
            'app.js',
            `          sourceType: 'scheduled',\n          sourceId: scheduled.id,\n          createdAt: serverTimestamp()`,
            `          sourceType: 'scheduled',\n          sourceId: scheduled.id,\n          walletId: scheduled.walletId || null,\n          cardId: scheduled.cardId || null,\n          purchaseDate: scheduled.purchaseDate || null,\n          installmentGroupId: scheduled.installmentGroupId || null,\n          installmentNumber: scheduled.installmentNumber ?? null,\n          installmentTotal: scheduled.installmentTotal ?? null,\n          createdAt: serverTimestamp()`
          );

          replaceOnce(
            'app.js',
            `async function processAutomations() {`,
            `async function repairAutomationRoutingMetadata() {\n  const recurringById = new Map(recurringCache.map(item => [item.id, item]));\n  const scheduledById = new Map(scheduledCache.map(item => [item.id, item]));\n  let changed = false;\n\n  for (const tx of txCache) {\n    const source = tx.sourceType === 'recurring'\n      ? recurringById.get(tx.sourceId)\n      : tx.sourceType === 'scheduled'\n        ? scheduledById.get(tx.sourceId)\n        : null;\n    if (!source) continue;\n\n    const patch = {};\n    const assignMissing = (key, value) => {\n      if ((tx[key] == null || tx[key] === '') && value != null && value !== '') patch[key] = value;\n    };\n\n    assignMissing('walletId', source.walletId || null);\n    if (tx.sourceType === 'scheduled') {\n      assignMissing('cardId', source.cardId || null);\n      assignMissing('purchaseDate', source.purchaseDate || null);\n      assignMissing('installmentGroupId', source.installmentGroupId || null);\n      assignMissing('installmentNumber', source.installmentNumber ?? null);\n      assignMissing('installmentTotal', source.installmentTotal ?? null);\n    }\n\n    if (Object.keys(patch).length) {\n      await updateDoc(userDoc('transactions', tx.id), patch);\n      changed = true;\n    }\n  }\n\n  return changed;\n}\n\nasync function processAutomations() {`
          );

          replaceOnce(
            'app.js',
            `    await processAutomations();\n    [txCache, recurringCache, scheduledCache] = await Promise.all([\n      loadCollection('transactions','date','desc'),\n      loadCollection('recurring','createdAt','desc'),\n      loadCollection('scheduled','dueDate','asc')\n    ]);`,
            `    await processAutomations();\n    [txCache, recurringCache, scheduledCache] = await Promise.all([\n      loadCollection('transactions','date','desc'),\n      loadCollection('recurring','createdAt','desc'),\n      loadCollection('scheduled','dueDate','asc')\n    ]);\n    const routingRepaired = await repairAutomationRoutingMetadata();\n    if (routingRepaired) txCache = await loadCollection('transactions','date','desc');`
          );

          replaceOnce(
            'app.js',
            `    if (due && due >= today && due <= end) rows.push({ date: due, name: item.name, amount: item.amount, icon:'📅' });`,
            `    if (due && due >= today && due <= end) rows.push({ date: due, name: item.name, amount: item.amount, icon:item.installmentGroupId ? '💳' : '📅' });`
          );

          replaceOnce(
            'index.html',
            `<div class="security-pill">🔒 Supabase Auth + dados isolados por usuário</div>`,
            `<div class="security-pill">🔒 Autenticação segura + dados isolados por usuário</div>`
          );

          replaceOnce('sw.js', "const CACHE='meu-patrimonio-v37';", "const CACHE='meu-patrimonio-v38';");
          replaceOnce('mobile/sw.js', "const CACHE = 'mp-mobile-v12';", "const CACHE = 'mp-mobile-v13';");

          fs.appendFileSync('tests/wallets-cards.test.mjs', `\n\ntest('compra no dia do fechamento entra na fatura seguinte', () => {\n  const schedule = cardInstallmentSchedule({ amount:100, installments:1, purchaseDate:'2026-08-05', closingDay:5, dueDay:12 });\n  assert.deepEqual(schedule.map(item => item.date), ['2026-09-12']);\n});\n\ntest('parcelamento legado sem status ainda compõe o valor em aberto', () => {\n  const metric = cardDebtMetrics([{id:'c1',creditLimit:1000}],[],[{cardId:'c1',amount:250,dueDate:'2026-09-12',purchaseDate:'2026-08-10'}],'2026-08-20');\n  assert.equal(metric.total,250);\n  assert.equal(metric.byCard[0].availableLimit,750);\n});\n\ntest('pagamento de parcela reduz caixa e dívida na mesma quantia sem alterar patrimônio líquido', () => {\n  const wallets = [{id:'w1',initialBalance:1000}];\n  const cards = [{id:'c1',creditLimit:5000}];\n  const before = positionMetrics([],[],'2026-08-20',wallets,cards,[\n    {cardId:'c1',walletId:'w1',status:'active',amount:300,dueDate:'2026-08-20',purchaseDate:'2026-08-10'},\n    {cardId:'c1',walletId:'w1',status:'active',amount:300,dueDate:'2026-09-20',purchaseDate:'2026-08-10'}\n  ]);\n  const after = positionMetrics([],[\n    {walletId:'w1',cardId:'c1',type:'expense',amount:300,date:'2026-08-20'}\n  ],'2026-08-20',wallets,cards,[\n    {cardId:'c1',walletId:'w1',status:'posted',amount:300,dueDate:'2026-08-20',purchaseDate:'2026-08-10'},\n    {cardId:'c1',walletId:'w1',status:'active',amount:300,dueDate:'2026-09-20',purchaseDate:'2026-08-10'}\n  ]);\n  assert.equal(before.netWorth,400);\n  assert.equal(after.netWorth,400);\n  assert.equal(after.walletAssets,700);\n  assert.equal(after.cardDebts,300);\n});\n`);

          fs.writeFileSync('tests/card-automation-integrity.test.mjs', `import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst appSource = readFileSync(new URL('../app.js', import.meta.url), 'utf8');\n\ntest('automações preservam roteamento financeiro ao materializar lançamentos', () => {\n  assert.match(appSource, /walletId: recurring\\.walletId \\|\\| null/);\n  assert.match(appSource, /walletId: scheduled\\.walletId \\|\\| null/);\n  assert.match(appSource, /cardId: scheduled\\.cardId \\|\\| null/);\n  assert.match(appSource, /installmentGroupId: scheduled\\.installmentGroupId \\|\\| null/);\n  assert.match(appSource, /installmentNumber: scheduled\\.installmentNumber \\?\\? null/);\n  assert.match(appSource, /installmentTotal: scheduled\\.installmentTotal \\?\\? null/);\n});\n\ntest('dados antigos de automações recebem reparo de metadados', () => {\n  assert.match(appSource, /async function repairAutomationRoutingMetadata\\(\\)/);\n  assert.match(appSource, /const routingRepaired = await repairAutomationRoutingMetadata\\(\\)/);\n});\n\ntest('recorrência não é exibida junto ao parcelamento do cartão', () => {\n  assert.match(appSource, /recurringLabel\\.style\\.display = editing \\|\\| cardMode \\? 'none' : ''/);\n});\n`);
          NODE

      - name: Validate syntax and tests
        run: |
          node --check app.js
          node --check finance-logic.js
          node --check mobile/mobile.js
          node --check sw.js
          node --check mobile/sw.js
          node --test tests/*.test.mjs

      - name: Commit validated fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-card-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js finance-logic.js index.html sw.js mobile/sw.js tests/wallets-cards.test.mjs tests/card-automation-integrity.test.mjs .github/workflows/one-shot-card-fix.yml
          git diff --cached --check
          git commit -m "fix: corrige integridade financeira de cartões e automações"
          git push origin HEAD:${GITHUB_REF_NAME}
