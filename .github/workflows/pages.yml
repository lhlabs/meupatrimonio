name: Validate final card edit safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/patrimony-card-edit
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply safety fix
        run: python .github/card-edit-safety-fix.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check finance-logic.js
          node --check mobile/mobile.js
      - name: Run financial and security tests
        run: node --test tests/*.test.mjs
      - name: Publish safety fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js tests/card-editing-integrity.test.mjs
          git commit -m "Protege edição de parcelas já iniciadas"
          git push origin HEAD:fix/patrimony-card-edit
