name: Validate and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/wallets-cards-debts
          persist-credentials: true
      - name: Apply wallet feature patch once
        if: github.event_name == 'pull_request'
        run: |
          if [ -f tools/apply-wallets-feature.mjs ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/apply-wallets-feature.mjs')
          src = path.read_text()

          def clean(body):
              # Converte os escapes artificiais usados pelo gerador para código literal
              # e impede que templates do código gerado sejam avaliados pelo próprio gerador.
              body = re.sub(r"\$\{\s*'\$\{([^']+)\}'\s*\}", lambda m: r'\${' + m.group(1) + '}', body)
              body = re.sub(r'(?<!\\)`', r'\`', body)
              body = re.sub(r'(?<!\\)\$\{', r'\${', body)
              return body

          def sanitize_region(start_marker, end_marker):
              global src
              start = src.find(start_marker)
              if start < 0:
                  raise SystemExit(f'marcador inicial não encontrado: {start_marker[:60]}')
              start += len(start_marker)
              end = src.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'marcador final não encontrado: {end_marker[:60]}')
              src = src[:start] + clean(src[start:end]) + src[end:]

          def sanitize_labeled(anchor, label):
              global src
              pos = src.find(anchor)
              if pos < 0:
                  raise SystemExit(f'âncora não encontrada: {anchor[:60]}')
              start = src.find('`', pos)
              if start < 0:
                  raise SystemExit(f'template não encontrado após: {anchor[:60]}')
              marker = f"`, '{label}');"
              end = src.find(marker, start + 1)
              if end < 0:
                  raise SystemExit(f'fechamento não encontrado para: {label}')
              src = src[:start + 1] + clean(src[start + 1:end]) + src[end:]

          sanitize_region("  const accountUi = `", "\n`;\n  text = replaceOnce(text, `function installTransactionPeriodFilter() {`")
          sanitize_labeled("text = replaceRegex(text, /async function loadAll", "load all accounts")
          sanitize_labeled("text = replaceRegex(text, /function txRow", "transaction row labels")
          sanitize_labeled("text = replaceRegex(text, /function renderAgenda", "agenda installment grouping")
          sanitize_labeled("text = replaceRegex(text, /function renderPositions", "debt composition rendering")
          sanitize_labeled("text = replaceRegex(text, /function openTransaction", "open transaction routes")
          sanitize_labeled("text = replaceRegex(text, /function openPosition", "open debt position")
          sanitize_labeled("text = replaceRegex(text, /\\$\\('#transactionForm'", "transaction submit wallet/card")
          sanitize_labeled("text = replaceRegex(text, /\\$\\('#positionForm'", "position debt submit")
          sanitize_labeled("text = replaceRegex(text, /async function loadData", "mobile load accounts")

          # Dois replaces curtos contêm template literal dentro do template do gerador.
          src = src.replace(
              "${walletsCache.find(w => w.id === tx.walletId) ? ` · ${esc(walletsCache.find(w => w.id === tx.walletId).name)}` : ''}",
              r"\${walletsCache.find(w => w.id === tx.walletId) ? \` · \${esc(walletsCache.find(w => w.id === tx.walletId).name)}\` : ''}"
          )

          path.write_text(src)
          PY
            node --check tools/apply-wallets-feature.mjs
            node tools/apply-wallets-feature.mjs
            rm -f tools/apply-wallets-feature.mjs .github/workflows/apply-wallets-feature.yml .wallet-feature-trigger
            git fetch origin main --depth=1
            git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- app.js finance-logic.js compat/firebase-firestore.js mobile/index.html mobile/mobile.js styles.css sw.js mobile/sw.js supabase/migrations/20260820143000_wallets_cards_debt_composition.sql tests/wallets-cards.test.mjs tests/wallet-security.test.mjs .github/workflows/pages.yml
            git add -u -- tools/apply-wallets-feature.mjs .github/workflows/apply-wallets-feature.yml .wallet-feature-trigger
            git commit -m "feat: add wallets cards installments and debt composition [wallet-patch-applied]"
            git push origin HEAD:feature/wallets-cards-debts
          fi
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check registration.js
          node --check security-hardening.js
          node --check privacy-controls.js
          node --check dashboard-metrics.js
          node --check finance-logic.js
          node --check firebase-config.js
          node --check supabase-config.js
          node --check supabase-client.js
          node --check compat/firebase-app.js
          node --check compat/firebase-auth.js
          node --check compat/firebase-firestore.js
          node --check compat/firebase-app-check.js
          node --check portfolio.js
          node --check sw.js
          node --check mobile/mobile.js
          node --check mobile/sw.js
          node --check tools/firebase-to-supabase/migrate-firestore-data.mjs
      - name: Run financial and security tests
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
