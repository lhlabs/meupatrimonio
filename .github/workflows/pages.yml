name: Apply Face ID autofill fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/faceid-autofill
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply autofill patch
        run: python .github/patch-faceid-autofill.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check mobile/mobile.js
          node --check sw.js
          node --check mobile/sw.js
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Publish validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html mobile/index.html sw.js mobile/sw.js tests/faceid-autofill.test.mjs
          git commit -m "Corrige preenchimento automático por Face ID"
          git push origin HEAD:fix/faceid-autofill
