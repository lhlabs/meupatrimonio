name: Validate and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check registration.js
          node --check security-hardening.js
          node --check privacy-controls.js
          node --check dashboard-metrics.js
          node --check finance-logic.js
          node --check firebase-config.js
          node --check supabase-config.js
          node --check supabase-client.js
          node --check compat/firebase-app.js
          node --check compat/firebase-auth.js
          node --check compat/firebase-firestore.js
          node --check compat/firebase-app-check.js
          node --check portfolio.js
          node --check sw.js
          node --check mobile/mobile.js
          node --check mobile/sw.js
          node --check tools/firebase-to-supabase/migrate-firestore-data.mjs
      - name: Run financial and security tests
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
