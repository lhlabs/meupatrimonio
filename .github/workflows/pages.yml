name: Validate permanent withdrawal deletion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/permanent-withdrawal-delete
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply focused change
        run: python .github/apply-permanent-withdrawal-delete.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check finance-logic.js
          node --check mobile/mobile.js
          node --check sw.js
          node --check mobile/sw.js
      - name: Run financial and security tests
        run: node --test tests/*.test.mjs
      - name: Publish validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- finance-logic.js app.js mobile/mobile.js sw.js mobile/sw.js
          git commit -m "Mantém aporte consumido ao excluir movimentação"
          git push origin HEAD:fix/permanent-withdrawal-delete
