name: Run recurring card patch

on:
  push:
    branches: [feat/recurring-card-routing]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recurring-card-routing
      - name: Execute patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/recurring-card-patch.yml').read_text()
          marker = "python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('patch source not found')
          code = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(code), 'recurring-card-patch', 'exec'))
          PY
      - name: Validate patch
        run: |
          git diff --check
          node --check app.js
          node --test tests/recurring-card-routing.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js sw.js tests/recurring-card-routing.test.mjs
          git commit -m "Integra recorrências ao cartão e à fatura"
          git push origin HEAD:feat/recurring-card-routing
