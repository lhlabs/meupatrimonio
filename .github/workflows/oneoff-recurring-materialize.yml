name: One-off recurring materialization patch

on:
  push:
    branches: [agent/antecipa-recorrencias-do-mes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/antecipa-recorrencias-do-mes
      - name: Patch app, tests and cache
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replaceOrFail = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Trecho não encontrado: ${label}`);
            return text.replace(from, to);
          };

          let app = fs.readFileSync('app.js', 'utf8');
          if (!app.includes('shouldMaterializeRecurring')) {
            app = replaceOrFail(
              app,
              'recurringDue, reserveMetrics, safeNumber, scoreMetrics, ymd',
              'recurringDue, reserveMetrics, safeNumber, scoreMetrics, shouldMaterializeRecurring, ymd',
              'import shouldMaterializeRecurring'
            );
          }
          if (app.includes('      if (due > today) break;')) {
            app = replaceOrFail(
              app,
              '      if (due > today) break;',
              '      if (!shouldMaterializeRecurring(due, today)) break;',
              'materialização antecipada da recorrência'
            );
          }
          fs.writeFileSync('app.js', app);

          let financeTest = fs.readFileSync('tests/finance-logic.test.mjs', 'utf8');
          const oldFinanceBlock = `test('period spending includes active recurring commitments and excludes contributions', () => {
  const tx=[
    {type:'expense',amount:1200,date:'2026-08-05',category:'Moradia',sourceType:'recurring'},
    {type:'expense',amount:300,date:'2026-08-10',category:'Mercado'},
    {type:'expense',amount:200,date:'2026-08-12',category:'Academia',sourceType:'scheduled'},
    {type:'expense',amount:1000,date:'2026-08-15',category:'Investimentos/Aportes'}
  ];
  const recurring=[
    {active:true,type:'expense',amount:1200,dayOfMonth:5,category:'Moradia',startDate:'2026-01-01',endDate:''},
    {active:true,type:'expense',amount:800,dayOfMonth:25,category:'Veículo',startDate:'2026-01-01',endDate:''}
  ];
  const result=periodSpendingMetrics(tx,recurring,new Date(2026,7,1),new Date(2026,7,19));
  assert.equal(result.recurringExpenses,2000);
  assert.equal(result.otherExpenses,500);
  assert.equal(result.totalExpenses,2500);
});`;
          const newFinanceBlock = `test('period spending uses materialized recurring transactions and excludes contributions', () => {
  const tx=[
    {type:'expense',amount:1200,date:'2026-08-05',category:'Moradia',sourceType:'recurring'},
    {type:'expense',amount:800,date:'2026-08-25',category:'Veículo',sourceType:'recurring'},
    {type:'expense',amount:300,date:'2026-08-10',category:'Mercado'},
    {type:'expense',amount:200,date:'2026-08-12',category:'Academia',sourceType:'scheduled'},
    {type:'expense',amount:1000,date:'2026-08-15',category:'Investimentos/Aportes'}
  ];
  const recurring=[
    {active:true,type:'expense',amount:1200,dayOfMonth:5,category:'Moradia',startDate:'2026-01-01',endDate:''},
    {active:true,type:'expense',amount:800,dayOfMonth:25,category:'Veículo',startDate:'2026-01-01',endDate:''}
  ];
  const result=periodSpendingMetrics(tx,recurring,new Date(2026,7,1),new Date(2026,7,19));
  assert.equal(result.recurringExpenses,2000);
  assert.equal(result.otherExpenses,500);
  assert.equal(result.totalExpenses,2500);
});`;
          if (financeTest.includes(oldFinanceBlock)) financeTest = financeTest.replace(oldFinanceBlock, newFinanceBlock);
          fs.writeFileSync('tests/finance-logic.test.mjs', financeTest);

          let reserveTest = fs.readFileSync('tests/reserve-recurring-regression.test.mjs', 'utf8');
          reserveTest = reserveTest.replace(
            "import { periodSpendingMetrics, recurringDue, reserveMetrics } from '../finance-logic.js';",
            "import { periodSpendingMetrics, recurringDue, reserveMetrics, shouldMaterializeRecurring } from '../finance-logic.js';"
          );
          const oldReserveBlock = `test('recorrências ativas do mês entram no gasto mensal mesmo antes do vencimento', () => {
  const recurring = [
    { active:true, type:'expense', amount:1200, dayOfMonth:5, category:'Moradia', startDate:'2026-08-10', endDate:'' },
    { active:true, type:'expense', amount:800, dayOfMonth:20, category:'Veículo', startDate:'2026-01-01', endDate:'' }
  ];
  const spending = periodSpendingMetrics([], recurring, new Date(2026,7,1), new Date(2026,7,19));
  const reserve = reserveMetrics({ reserve:20000, transactions:[], recurring, todayYmd:'2026-08-19', targetMonths:6 });
  assert.equal(spending.recurringExpenses, 2000);
  assert.equal(spending.otherExpenses, 0);
  assert.equal(spending.totalExpenses, 2000);
  assert.equal(reserve.monthlyBase, 2000);
});`;
          const newReserveBlock = `test('recorrências do mês são materializadas antes do vencimento e entram no gasto', () => {
  assert.equal(shouldMaterializeRecurring('2026-08-25', '2026-08-19'), true);
  assert.equal(shouldMaterializeRecurring('2026-09-05', '2026-08-19'), false);
  const recurring = [
    { active:true, type:'expense', amount:1200, dayOfMonth:5, category:'Moradia', startDate:'2026-08-10', endDate:'' },
    { active:true, type:'expense', amount:800, dayOfMonth:20, category:'Veículo', startDate:'2026-01-01', endDate:'' }
  ];
  const transactions = [
    { type:'expense', amount:1200, date:'2026-08-10', category:'Moradia', recurring:true },
    { type:'expense', amount:800, date:'2026-08-20', category:'Veículo', sourceType:'recurring' }
  ];
  const spending = periodSpendingMetrics(transactions, recurring, new Date(2026,7,1), new Date(2026,7,19));
  const reserve = reserveMetrics({ reserve:20000, transactions, recurring, todayYmd:'2026-08-19', targetMonths:6 });
  assert.equal(spending.recurringExpenses, 2000);
  assert.equal(spending.otherExpenses, 0);
  assert.equal(spending.totalExpenses, 2000);
  assert.equal(reserve.monthlyBase, 2000);
});`;
          if (reserveTest.includes(oldReserveBlock)) reserveTest = reserveTest.replace(oldReserveBlock, newReserveBlock);
          fs.writeFileSync('tests/reserve-recurring-regression.test.mjs', reserveTest);

          let spendingTest = fs.readFileSync('tests/spending-period-regression.test.mjs', 'utf8');
          spendingTest = spendingTest.replace(
            "import { monthlySpendingGoal, periodSpendingMetrics, scoreMetrics } from '../finance-logic.js';",
            "import { monthMetrics, monthlySpendingGoal, periodSpendingMetrics, scoreMetrics } from '../finance-logic.js';"
          );
          spendingTest = spendingTest.replace(
            "    { type:'expense', amount:4500, date:'2026-08-05', category:'Moradia', sourceType:'recurring' },\n    { type:'expense', amount:1200, date:'2026-08-10', category:'Mercado' },",
            "    { type:'expense', amount:4500, date:'2026-08-05', category:'Moradia', sourceType:'recurring' },\n    { type:'expense', amount:700, date:'2026-08-25', category:'Seguro', sourceType:'recurring' },\n    { type:'expense', amount:1200, date:'2026-08-10', category:'Mercado' },"
          );
          spendingTest = spendingTest.replace(
            "    { type:'expense', amount:1500, date:'2026-08-05', category:'Moradia', sourceType:'recurring' },\n    { type:'expense', amount:600, date:'2026-08-08', category:'Mercado' }",
            "    { type:'expense', amount:1500, date:'2026-08-05', category:'Moradia', sourceType:'recurring' },\n    { type:'expense', amount:5000, date:'2026-08-25', category:'Veículo', sourceType:'recurring' },\n    { type:'expense', amount:600, date:'2026-08-08', category:'Mercado' }"
          );
          if (!spendingTest.includes("receita recorrente antecipada já compõe a renda e a meta de 60%")) {
            spendingTest += `\n\ntest('receita recorrente antecipada já compõe a renda e a meta de 60%', () => {\n  const tx = [\n    { type:'income', amount:3000, date:'2026-08-01', category:'Renda extra' },\n    { type:'income', amount:7000, date:'2026-08-30', category:'Salário', sourceType:'recurring' },\n    { type:'expense', amount:2000, date:'2026-08-25', category:'Moradia', sourceType:'recurring' }\n  ];\n  const metrics = monthMetrics(tx, new Date(2026,7,1));\n  assert.equal(metrics.income, 10000);\n  assert.equal(monthlySpendingGoal(metrics.income), 6000);\n  assert.equal(metrics.consumption, 2000);\n  assert.equal(metrics.balance, 8000);\n});\n`;
          }
          fs.writeFileSync('tests/spending-period-regression.test.mjs', spendingTest);

          let sw = fs.readFileSync('sw.js', 'utf8');
          sw = sw.replace("const CACHE='meu-patrimonio-v24';", "const CACHE='meu-patrimonio-v25';");
          fs.writeFileSync('sw.js', sw);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js tests/finance-logic.test.mjs tests/reserve-recurring-regression.test.mjs tests/spending-period-regression.test.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Valida recorrências antecipadas no mês"
            git push origin HEAD:agent/antecipa-recorrencias-do-mes
          fi
