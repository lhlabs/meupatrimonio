name: Run recurring card patch on PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Execute patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/recurring-card-patch.yml').read_text()
          marker = "python - <<'PY'\n"
          if marker not in source:
              raise SystemExit('patch source not found')
          raw = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          old_def = "def replace_once(old, new, label):\n    global text\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, found {count}')\n    text = text.replace(old, new, 1)\n"
          new_def = "def replace_once(old, new, label):\n    global text\n    count = text.count(old)\n    if count == 1:\n        text = text.replace(old, new, 1)\n        return\n    if label == 'automation materialization' and count == 0:\n        function_start = text.find('async function processAutomations()')\n        anchor = '      const id = `rec_${recurring.id}_${due.slice(0,7)}`;'\n        start = text.find(anchor, function_start)\n        end_marker = '      cursor.setMonth(cursor.getMonth() + 1);'\n        end = text.find(end_marker, start)\n        if function_start >= 0 and start >= 0 and end >= 0:\n            text = text[:start] + new + text[end + len(end_marker):]\n            return\n    raise SystemExit(f'{label}: expected 1 match, found {count}')\n"
          if old_def not in code:
              raise SystemExit('replace_once definition not found')
          code = code.replace(old_def, new_def, 1)
          exec(compile(code, 'recurring-card-patch', 'exec'))
          PY
      - name: Validate patch
        run: |
          git diff --check
          node --check app.js
          node --test tests/recurring-card-routing.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js sw.js tests/recurring-card-routing.test.mjs
          git commit -m "Integra recorrências ao cartão e à fatura"
          git push origin HEAD:${{ github.head_ref }}
