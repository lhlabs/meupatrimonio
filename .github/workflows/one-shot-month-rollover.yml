name: One-shot month rollover integrity fix

on:
  push:
    branches: [fix/month-rollover-integrity]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/month-rollover-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused rollover fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              "let actionBusy = false;\n",
              "let actionBusy = false;\nlet observedToday = ymd(new Date());\nlet rolloverSyncBusy = false;\n",
              'rollover state'
          )

          migration_pattern = re.compile(r"(async function migrateLegacyRecurring\(\) \{.*?await setDoc\(userDoc\('recurring', id\), \{.*?\n\s*active: true,\n)(\s*createdAt: serverTimestamp\(\),)", re.S)
          s, count = migration_pattern.subn(r"\1      walletId: tx.walletId || null,\n      cardId: null,\n\2", s, count=1)
          if count != 1:
              raise SystemExit(f'legacy migration routing: expected 1 match, found {count}')

          helper = r'''function dateKeyFromTimestamp(value) {
  if (!value) return '';
  if (typeof value === 'string') return value.slice(0, 10);
  if (typeof value?.toDate === 'function') return ymd(value.toDate());
  if (Number.isFinite(value?.seconds)) return ymd(new Date(value.seconds * 1000));
  return '';
}

function walletTrackingStart(walletId) {
  return dateKeyFromTimestamp(walletById(walletId)?.createdAt);
}

function dueCanUseWallet(source, due) {
  if (!source?.walletId) return true;
  const trackingStart = walletTrackingStart(source.walletId);
  return !trackingStart || !due || String(due) >= trackingStart;
}

'''
          replace_once(
              "async function repairAutomationRoutingMetadata() {\n",
              helper + "async function repairAutomationRoutingMetadata() {\n",
              'routing baseline helpers'
          )

          replace_once(
              "    assignMissing('walletId', source.walletId || null);\n",
              "    if (dueCanUseWallet(source, tx.date)) assignMissing('walletId', source.walletId || null);\n",
              'historical wallet routing guard'
          )

          repair_wallets = r'''async function repairRecurringWalletAssignments() {
  const activeWallets = walletsCache.filter(item => item.active !== false);
  if (activeWallets.length !== 1) return false;
  const walletId = activeWallets[0].id;
  let changed = false;
  for (const recurring of recurringCache.filter(item => !item.walletId && !item.cardId)) {
    await updateDoc(userDoc('recurring', recurring.id), { walletId, updatedAt: serverTimestamp() });
    changed = true;
  }
  return changed;
}

'''
          replace_once(
              "async function processAutomations() {\n",
              repair_wallets + "async function processAutomations() {\n",
              'legacy recurring wallet repair'
          )

          replace_once(
              "      if (!shouldMaterializeRecurring(due, today)) break;\n      const id = `rec_${recurring.id}_${due.slice(0,7)}`;\n",
              "      if (!shouldMaterializeRecurring(due, today)) break;\n      if (!dueCanUseWallet(recurring, due)) {\n        cursor.setMonth(cursor.getMonth() + 1);\n        continue;\n      }\n      const id = `rec_${recurring.id}_${due.slice(0,7)}`;\n",
              'recurring wallet baseline guard'
          )

          replace_once(
              "    const repaired = await repairLegacyRecurringStartDates();\n    if (repaired) recurringCache = await loadCollection('recurring','createdAt','desc');\n    await processAutomations();\n",
              "    const repaired = await repairLegacyRecurringStartDates();\n    const walletAssignmentsRepaired = await repairRecurringWalletAssignments();\n    if (repaired || walletAssignmentsRepaired) recurringCache = await loadCollection('recurring','createdAt','desc');\n    await processAutomations();\n",
              'load recurring wallet repair'
          )

          rollover_function = r'''async function synchronizeDateRollover() {
  const now = new Date();
  const today = ymd(now);
  if (today === observedToday || !user || rolloverSyncBusy) return;
  const previousDay = observedToday;
  rolloverSyncBusy = true;
  observedToday = today;
  try {
    if (monthKey(selectedMonth) === previousDay.slice(0, 7)) {
      selectedMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    }
    if (selectedYear === Number(previousDay.slice(0, 4))) selectedYear = now.getFullYear();
    await loadAll();
  } catch (error) {
    console.error('Falha ao sincronizar a virada de data.', error);
  } finally {
    rolloverSyncBusy = false;
  }
}

'''
          replace_once(
              "async function loadAll() {\n",
              rollover_function + "async function loadAll() {\n",
              'rollover synchronizer'
          )

          replace_once(
              "prepareUi();\nonAuthStateChanged(auth, async current => {\n",
              "prepareUi();\nwindow.addEventListener('focus', () => void synchronizeDateRollover());\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) void synchronizeDateRollover(); });\nsetInterval(() => void synchronizeDateRollover(), 60_000);\nonAuthStateChanged(auth, async current => {\n",
              'rollover triggers'
          )

          path.write_text(s)

          tests = Path('tests/card-automation-integrity.test.mjs')
          t = tests.read_text()
          extra = r'''

test('virada de data sincroniza o mês e reprocessa automações sem exigir recarga manual', () => {
  assert.match(appSource, /async function synchronizeDateRollover\(\)/);
  assert.match(appSource, /window\.addEventListener\('focus', \(\) => void synchronizeDateRollover\(\)\)/);
  assert.match(appSource, /visibilitychange/);
  assert.match(appSource, /setInterval\(\(\) => void synchronizeDateRollover\(\), 60_000\)/);
});

test('recorrências legadas recebem carteira única sem rebaixar movimentos anteriores à criação da carteira', () => {
  assert.match(appSource, /async function repairRecurringWalletAssignments\(\)/);
  assert.match(appSource, /activeWallets\.length !== 1/);
  assert.match(appSource, /dueCanUseWallet\(source, tx\.date\)/);
  assert.match(appSource, /dueCanUseWallet\(recurring, due\)/);
  assert.match(appSource, /walletId: tx\.walletId \|\| null/);
});
'''
          if "virada de data sincroniza o mês" in t:
              raise SystemExit('tests already contain rollover regression')
          tests.write_text(t.rstrip() + extra + '\n')

          wallet_tests = Path('tests/wallets-cards.test.mjs')
          w = wallet_tests.read_text()
          card_extra = r'''

test('fechamento 28 e vencimento 7 atravessam o mês corretamente', () => {
  const beforeClose = cardInstallmentSchedule({ amount:600, installments:6, purchaseDate:'2026-09-27', closingDay:28, dueDay:7 });
  const onClose = cardInstallmentSchedule({ amount:600, installments:6, purchaseDate:'2026-09-28', closingDay:28, dueDay:7 });
  assert.equal(beforeClose[0].date, '2026-10-07');
  assert.equal(onClose[0].date, '2026-11-07');
  assert.equal(beforeClose.at(-1).date, '2027-03-07');
  assert.equal(onClose.at(-1).date, '2027-04-07');
});
'''
          if "fechamento 28 e vencimento 7 atravessam" in w:
              raise SystemExit('card rollover test already exists')
          wallet_tests.write_text(w.rstrip() + card_extra + '\n')

          sw = Path('sw.js')
          sw_text = sw.read_text()
          if "meu-patrimonio-v39" not in sw_text:
              raise SystemExit('unexpected root service-worker cache version')
          sw.write_text(sw_text.replace('meu-patrimonio-v39', 'meu-patrimonio-v40', 1))

          msw = Path('mobile/sw.js')
          msw_text = msw.read_text()
          if "mp-mobile-v14" not in msw_text:
              raise SystemExit('unexpected mobile service-worker cache version')
          msw.write_text(msw_text.replace('mp-mobile-v14', 'mp-mobile-v15', 1))
          PY
      - name: Validate syntax and regression suite
        run: |
          node --check app.js
          node --check finance-logic.js
          node --check mobile/mobile.js
          node --check sw.js
          node --check mobile/sw.js
          node --test tests/*.test.mjs
      - name: Commit validated patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-month-rollover.yml
          git add -- app.js tests/card-automation-integrity.test.mjs tests/wallets-cards.test.mjs sw.js mobile/sw.js
          git commit -m "Corrige virada mensal e roteamento de recorrências"
          git push origin HEAD:fix/month-rollover-integrity
