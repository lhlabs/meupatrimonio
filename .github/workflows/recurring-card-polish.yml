name: Polish recurring card implementation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve posted recurring-card history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text()
          old = "for (const item of scheduledCache.filter(row => String(row.id || '').startsWith(prefix))) {"
          new = "for (const item of scheduledCache.filter(row => String(row.id || '').startsWith(prefix) && row.status === 'active')) {"
          if text.count(old) != 1:
              raise SystemExit('pending recurring schedule filter not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          git diff --check
          node --check app.js
          node --test tests/recurring-card-routing.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js
          git commit -m "Preserva histórico de recorrências no cartão"
          git push origin HEAD:${{ github.head_ref }}
